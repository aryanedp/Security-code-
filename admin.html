<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARYAN_EDP Admin</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#07080d;
 color:#fff;
 font-family:Arial,system-ui,sans-serif;
 min-height:100vh;
}

body:before{
 content:"";
 position:fixed;
 inset:-30%;
 z-index:-1;
 background:
 radial-gradient(circle at 15% 15%,#6366f155,transparent 30%),
 radial-gradient(circle at 85% 20%,#06b6d455,transparent 30%),
 radial-gradient(circle at 50% 100%,#a855f744,transparent 30%);
 filter:blur(50px);
}

.container{
 width:min(1000px,94%);
 margin:auto;
}

.card{
 margin-top:20px;
 padding:22px;
 border-radius:20px;
 background:#ffffff0b;
 border:1px solid #ffffff15;
 box-shadow:0 20px 70px #0008;
 backdrop-filter:blur(18px);
}

h1{
 margin:0;
 font-size:40px;
 background:linear-gradient(90deg,#67e8f9,#818cf8,#c084fc);
 -webkit-background-clip:text;
 color:transparent;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

button{
 border:0;
 border-radius:11px;
 padding:12px 16px;
 color:white;
 background:linear-gradient(135deg,#6366f1,#8b5cf6);
 font-weight:bold;
 cursor:pointer;
}

button:disabled{opacity:.5}

.secondary{
 background:#ffffff0b;
 border:1px solid #ffffff15;
}

input{
 width:100%;
 padding:13px;
 margin-top:7px;
 border-radius:10px;
 border:1px solid #ffffff18;
 background:#ffffff08;
 color:white;
}

label{
 display:block;
 margin:12px 0;
}

.hidden{display:none!important}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}

.stat{
 padding:20px;
 border-radius:16px;
 background:#ffffff08;
}

.stat strong{
 font-size:35px;
}

.request{
 padding:18px;
 margin-top:12px;
 border-radius:16px;
 background:#ffffff08;
 border:1px solid #ffffff12;
}

.file{
 padding:15px;
 margin-top:10px;
 border-radius:14px;
 background:#ffffff08;
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
}

.green{color:#86efac}
.yellow{color:#fde68a}
.red{color:#fca5a5}

.notice{
 padding:15px;
 border-radius:12px;
 background:#ffffff08;
 color:#cbd5e1;
}

a{color:#93c5fd}

@media(max-width:600px){
 .stats{
  grid-template-columns:1fr;
 }

 .top,.file{
  flex-direction:column;
  align-items:stretch;
 }
}
</style>
</head>

<body>

<div id="loginPage" class="container">

 <div class="card" style="text-align:center">

  <h1>ARYAN_EDP</h1>

  <p>Admin Panel</p>

  <button id="loginBtn">
   🔐 Login with Google
  </button>

  <p id="loginMsg"></p>

 </div>

</div>


<div id="adminPage" class="container hidden">

 <div class="card">

  <div class="top">

   <div>
    <h1>ARYAN_EDP</h1>
    <small>Admin Panel</small>
   </div>

   <button id="logout" class="secondary">
    Logout
   </button>

  </div>

 </div>


 <div class="card">

  <h2>📊 Dashboard</h2>

  <div class="stats">

   <div class="stat">
    <div>Pending Requests</div>
    <strong id="pending">0</strong>
   </div>

   <div class="stat">
    <div>Total Requests</div>
    <strong id="total">0</strong>
   </div>

  </div>

 </div>


 <div class="card">

  <h2>💳 Payment Requests</h2>

  <div id="requests">
   <div class="notice">
    Loading...
   </div>
  </div>

 </div>


 <div class="card">

  <h2>📁 Add File</h2>

  <p>
   Yahan actual file upload karke Firebase Storage me save kar sakte ho.
  </p>

  <label>
   File Title
   <input id="fileTitle" placeholder="Example: Premium File">
  </label>

  <label>
   Description
   <input id="fileDescription" placeholder="File description">
  </label>

  <label>
   Select File
   <input id="fileUpload" type="file">
  </label>

  <button id="uploadBtn">
   📤 Upload File
  </button>

  <p id="uploadMsg"></p>

 </div>


 <div class="card">

  <h2>📂 Current Files</h2>

  <div id="files">
   <div class="notice">Loading...</div>
  </div>

 </div>

</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 getDocs,
 getDoc,
 doc,
 setDoc,
 updateDoc,
 query,
 orderBy,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
 getStorage,
 ref,
 uploadBytes,
 getDownloadURL,
 deleteObject
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


const firebaseConfig={
 apiKey:"AIzaSyC_w8EejF-SjIStlPlKdEI1QEuHvh9fQ1E",
 authDomain:"sandeep-e363a.firebaseapp.com",
 projectId:"sandeep-e363a",
 storageBucket:"sandeep-e363a.firebasestorage.app",
 messagingSenderId:"812128011642",
 appId:"1:812128011642:web:ce340a1220a53254cc82c3",
 measurementId:"G-HESB6RJ0M8"
};


const ADMIN_EMAIL=
 "sandeeparyanx1@gmail.com";


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);

const $=id=>document.getElementById(id);


$("loginBtn").onclick=async()=>{

 try{

  $("loginBtn").disabled=true;
  $("loginMsg").textContent=
   "Google login opening...";

  const provider=new GoogleAuthProvider();

  await signInWithPopup(auth,provider);

 }catch(error){

  console.error(error);

  $("loginMsg").textContent=
   error.code+" : "+error.message;

  $("loginBtn").disabled=false;

 }

};


$("logout").onclick=()=>{
 signOut(auth);
};


onAuthStateChanged(auth,async user=>{

 if(!user){

  $("loginPage").classList.remove("hidden");
  $("adminPage").classList.add("hidden");

  return;
 }


 if(
  (user.email||"").toLowerCase() !==
  ADMIN_EMAIL.toLowerCase()
 ){

  await signOut(auth);

  $("loginMsg").textContent=
   "❌ This Google account is not authorized as admin.";

  return;

 }


 $("loginPage").classList.add("hidden");
 $("adminPage").classList.remove("hidden");


 await loadRequests();
 await loadFiles();

});


async function loadRequests(){

 try{

  const snap=await getDocs(
   query(
    collection(db,"paymentRequests"),
    orderBy("createdAt","desc")
   )
  );


  let pending=0;

  $("total").textContent=snap.size;

  $("requests").innerHTML="";


  if(snap.empty){

   $("requests").innerHTML=
    '<div class="notice">No payment requests.</div>';

   $("pending").textContent="0";

   return;
  }


  snap.forEach(d=>{

   const x=d.data();

   if(x.status==="pending")pending++;


   const box=document.createElement("div");

   box.className="request";


   box.innerHTML=`

    <b>👤 ${esc(x.userEmail||"Unknown")}</b>

    <br><br>

    Credits:
    <b>${Number(x.credits||0)}</b>

    &nbsp; | &nbsp;

    Amount:
    <b>₹${Number(x.amount||0)}</b>

    <br><br>

    UTR:
    <b>${esc(x.utr||"")}</b>

    <br><br>

    Status:
    <b>${esc(x.status||"pending")}</b>

   `;


   if(x.screenshotURL){

    const view=document.createElement("a");

    view.href=x.screenshotURL;
    view.target="_blank";
    view.textContent="🖼️ View Screenshot";

    view.style.display="inline-block";
    view.style.marginTop="12px";

    box.appendChild(view);

   }


   if(x.status==="pending"){

    const accept=document.createElement("button");

    accept.textContent="✅ ACCEPT";
    accept.style.marginTop="15px";
    accept.style.marginRight="8px";

    accept.onclick=()=>{
     reviewPayment(d.id,x,true);
    };


    const reject=document.createElement("button");

    reject.textContent="❌ REJECT";
    reject.className="secondary";
    reject.style.marginTop="15px";

    reject.onclick=()=>{
     reviewPayment(d.id,x,false);
    };


    box.append(accept,reject);

   }


   $("requests").appendChild(box);

  });


  $("pending").textContent=pending;

 }catch(error){

  console.error(error);

  $("requests").innerHTML=
   '<div class="notice">Error: '+
   esc(error.message)+
   '</div>';

 }

}


async function reviewPayment(id,data,accepted){

 try{

  if(
   !confirm(
    accepted?
    "Payment accept karein?":
    "Payment reject karein?"
   )
  )return;


  if(accepted){

   const userRef=
    doc(db,"users",data.uid);

   const snap=
    await getDoc(userRef);

   const oldCredits=
    Number(snap.data()?.credits||0);

   const addCredits=
    Number(data.credits||0);


   await setDoc(
    userRef,
    {
     credits:oldCredits+addCredits
    },
    {merge:true}
   );

  }


  await updateDoc(
   doc(db,"paymentRequests",id),
   {
    status:accepted?"accepted":"rejected",
    reviewedAt:serverTimestamp(),
    reviewedBy:auth.currentUser.email
   }
  );


  await loadRequests();

 }catch(error){

  console.error(error);

  alert(
   "Payment update failed:\n"+
   error.message
  );

 }

}


$("uploadBtn").onclick=async()=>{

 const file=$("fileUpload").files[0];

 const title=$("fileTitle").value.trim();

 const description=
  $("fileDescription").value.trim();


 if(!file){

  alert("Pehle file select karo.");

  return;
 }


 if(!title){

  alert("File title enter karo.");

  return;
 }


 try{

  $("uploadBtn").disabled=true;

  $("uploadMsg").textContent=
   "📤 File Firebase Storage me upload ho rahi hai...";


  const path=
   "files/"+
   Date.now()+
   "-"+
   clean(file.name);


  const storageRef=
   ref(storage,path);


  await uploadBytes(
   storageRef,
   file,
   {
    contentType:file.type
   }
  );


  const downloadURL=
   await getDownloadURL(storageRef);


  await setDoc(
   doc(collection(db,"files")),
   {
    title:title,
    description:description,
    fileName:file.name,
    storagePath:path,
    downloadURL:downloadURL,
    size:file.size,
    createdAt:serverTimestamp()
   }
  );


  $("uploadMsg").textContent=
   "✅ File successfully uploaded!";


  $("fileTitle").value="";
  $("fileDescription").value="";
  $("fileUpload").value="";


  await loadFiles();


 }catch(error){

  console.error(error);

  $("uploadMsg").textContent=
   "❌ Upload failed: "+
   error.code+" : "+error.message;

 }finally{

  $("uploadBtn").disabled=false;

 }

};


async function loadFiles(){

 try{

  const snap=await getDocs(
   query(
    collection(db,"files"),
    orderBy("createdAt","desc")
   )
  );


  $("files").innerHTML="";


  if(snap.empty){

   $("files").innerHTML=
    '<div class="notice">No files.</div>';

   return;
  }


  snap.forEach(d=>{

   const x=d.data();

   const box=document.createElement("div");

   box.className="file";


   const info=document.createElement("div");

   info.innerHTML=
    "<b>"+esc(x.title||"File")+"</b><br>"+
    "<small>"+esc(x.description||"")+"</small>";


   const link=document.createElement("a");

   link.href=x.downloadURL||"#";
   link.target="_blank";
   link.textContent="Open";


   box.append(info,link);


   $("files").appendChild(box);

  });

 }catch(error){

  console.error(error);

  $("files").innerHTML=
   '<div class="notice">'+
   esc(error.message)+
   '</div>';

 }

}


function clean(name){

 return name.replace(
  /[^a-zA-Z0-9._-]/g,
  "_"
 );

}


function esc(value){

 return String(value).replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[c])
 );

}

</script>

</body>
</html>
